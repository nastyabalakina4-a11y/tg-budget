# Автодеплой: при каждом push в main (или вручную кнопкой Run workflow)
# 1) выкладывает бэкенд на Cloudflare Workers и настраивает бота,
# 2) публикует интерфейс на GitHub Pages с адресом этого бэкенда.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  worker:
    name: Cloudflare Worker + бот
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что секреты заданы
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN ALLOWED_USER_IDS; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Тесты
        run: npm test

      - name: Создать базу D1 (если её ещё нет) и подставить её id
        run: |
          get_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name=="tg-budget") | .uuid'; }
          ID=$(get_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create tg-budget
            ID=$(get_id)
          fi
          echo "D1 id: $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml

      - name: Применить миграции базы
        run: npx wrangler d1 migrations apply DB --remote

      - name: Выложить Worker
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Не нашёл адрес *.workers.dev. Откройте в Cloudflare раздел Workers & Pages один раз, чтобы создать поддомен workers.dev."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Передать секреты в Worker
        run: |
          printf '%s' "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN
          printf '%s' "$ALLOWED_USER_IDS" | npx wrangler secret put ALLOWED_USER_IDS

      - name: Настроить бота (webhook, команды, кнопка меню)
        run: |
          KEY=$(printf '%s' "$BOT_TOKEN" | sha256sum | cut -c1-32)
          sleep 5  # даём новой версии с секретами разойтись по сети Cloudflare
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            -X POST -H "X-Setup-Key: $KEY" "${{ steps.deploy.outputs.url }}/setup" | tee setup.json
          jq -e '.webhook.ok' setup.json > /dev/null || { echo "::error::Telegram не принял webhook — проверьте BOT_TOKEN"; exit 1; }

  pages:
    name: GitHub Pages
    needs: worker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Записать адрес API в config.js
        env:
          API_URL: ${{ needs.worker.outputs.url }}
        run: |
          echo "window.APP_CONFIG = { apiUrl: '$API_URL' };" > webapp/config.js
          cat webapp/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: pages
        uses: actions/deploy-pages@v4
